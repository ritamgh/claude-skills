  const n = node(id)
  if (n) return h('button', { class: 'pane-chip', 'data-id': id, title: n.label, 'aria-label': 'Open ' + id, onclick: () => selectNode(id, byId('#prdpane .pane-chip', id)) }, id)
  if (arr(S.plan.comments).some(c => c.id === id)) return h('button', { class: 'pane-chip', 'data-id': id, 'aria-label': 'Show comment ' + id, onclick: () => paneShowComment(id) }, id)
  return h('span', { class: 'pane-chip gone', 'data-id': id, title: 'Not in the plan' }, id)
}
let hlTimer = null
function paneShowComment(id) {
  S.view = 'prd'
  if (isPhone() && S.pane.open) closePane() // the full-screen sheet hides the PRD
  renderTabs()
  const el = document.querySelector('#p-prd .cm[data-id="' + CSS.escape(id) + '"]')
  if (!el) return
  document.querySelectorAll('.cm.hl').forEach(e => e.classList.remove('hl'))
  S.pane.hl = id
  el.classList.add('hl')
  el.scrollIntoView({ block: 'center' })
  clearTimeout(hlTimer)
  hlTimer = setTimeout(() => { S.pane.hl = null; document.querySelectorAll('.cm.hl').forEach(e => e.classList.remove('hl')) }, 2400)
}
// Posts the answer as a comment (the session then proposes a change): anchored on the first node it links, never on a comment, cut at 5000 the way the core cuts.
async function paneTurn(m, key, links) {
  const cps = Array.from(String(m.text))
  const text = cps.length > 5000 ? cps.slice(0, 5000 - TRUNC.length).join('') + TRUNC : cps.join('')
  const anchor = links.find(id => node(id))
  const d = await post({ type: 'comment', text, author: 'Me (pane)', ...(anchor ? { anchor } : {}) })
  if (!d) return
  S.pane.sent[key] = true
  renderPane()
  toast('Sent as a comment; the session will propose a change')
}
function paneAnswerExtras(m) {
  const links = [...new Set(arr(m.links).map(String))]
  const key = String(m.ref || m.at || '')
  const sent = !!S.pane.sent[key]
  return [
    links.length ? h('div', { class: 'pane-links' }, h('span', {}, 'Refers to'), links.map(paneChip)) : null,
    String(m.text == null ? '' : m.text).trim() ? h('div', { class: 'pane-acts' },
      h('button', { class: 'btn pane-turn', 'data-act': 'turn', 'data-ref': key, disabled: sent, onclick: () => paneTurn(m, key, links) }, sent ? 'Sent' : 'Turn into proposal')) : null,
  ]
}
const paneFocusKey = e => e.dataset.act ? '[data-act="' + e.dataset.act + '"]' + (e.dataset.ref ? '[data-ref="' + CSS.escape(e.dataset.ref) + '"]' : '')
  : e.classList.contains('pane-chip') ? '.pane-chip[data-id="' + CSS.escape(e.dataset.id) + '"]'
    : e.classList.contains('pane-start') ? '.pane-start[data-i="' + e.dataset.i + '"]'
      : e.classList.contains('pane-close') ? '.pane-close' : null
function renderPane() {
  const el = $('#prdpane'), th = paneThread()
  const sheet = paneSheet()
  el.classList.toggle('open', S.pane.open)
  document.body.classList.toggle('pane-open', sheet && isPhone())
  document.body.classList.toggle('pane-sheet', sheet)
  el.setAttribute('role', sheet ? 'dialog' : 'complementary')
  const sig = paneSig()
  if (S.pane.seen === null || paneShown()) S.pane.seen = sig
  const b = $('#pane-open')
  if (b) paneBtnSync(b)
  const waiting = S.pane.asking != null || arr(S.plan.requests).some(r => r.type === 'ask' && !r.node)
  const vis = el.getClientRects().length > 0
  const was = el.contains(document.activeElement) && document.activeElement !== el ? document.activeElement : null
  const caret = was && was.hasAttribute('data-draft') ? [was.selectionStart, was.selectionEnd] : null
  const key = was && !caret ? paneFocusKey(was) : null
  const old = el.querySelector('.th-list')
  const follow = !old || el.dataset.vis !== '1' || old.scrollHeight - old.scrollTop - old.clientHeight < 8
  const top = old ? old.scrollTop : 0
  const fresh = !old || el.dataset.vis !== '1' || el.dataset.last !== sig // opened now, or a new session reply since the last render
  el.dataset.vis = vis ? '1' : ''
  el.dataset.last = sig
  const ids = arr(S.plan.comments).map(c => c.id)
  const starts = ['Which comments conflict?', 'What would change if we accept ' + (ids[0] || 'CM1') + '?', 'What is still unclear in this PRD?']
  const fill = t => { S.pane.draft = t; renderPane(); const f = $('#pane-text'); f.focus({ preventScroll: true }); f.setSelectionRange(t.length, t.length) }
  const main = th.length || waiting
    ? h('div', { class: 'th-list', role: 'log', tabindex: '0', 'aria-label': 'Conversation about the PRD' },
      th.map(m => thMsg(m, m.role === 'user' ? null : paneAnswerExtras(m))), waiting ? thWait() : null)
    : h('div', { class: 'pane-empty' },
      h('p', { class: 'np-empty' }, 'Ask anything about the whole PRD or the comments: what conflicts, what a comment would change, what is still unclear.'),
      h('div', { class: 'pane-starts' }, starts.map((t, i) => h('button', { class: 'btn pane-start', 'data-i': String(i), onclick: () => fill(t) }, t))))
  el.replaceChildren(
    h('div', { class: 'pane-head' }, h('h2', {}, 'Ask about the PRD'), h('button', { class: 'btn pane-close', title: 'Close (Esc)', onclick: closePane }, 'Close')),
    h('div', { class: 'pane-main' }, sheet && isPhone() && S.err ? h('p', { class: 'np-err', role: 'alert' }, S.err) : null, main),
    h('div', { class: 'pane-comp' }, thComposer({
      id: 'pane-text', draft: 'pane-ask', value: S.pane.draft, placeholder: 'Ask about the whole PRD or the comments…', label: 'Ask the session about the PRD',
      onInput: v => { S.pane.draft = v },
      submit: async text => {
        const d = await post({ type: 'ask', text })
        if (!d) return
        S.pane.draft = ''
        if (d.rev > S.rev) S.pane.asking = d.rev
        renderPane()
        const f = $('#pane-text')
        if (f) f.focus({ preventScroll: true })
      },
    })))
  const list = el.querySelector('.th-list')
  if (list) {
    list.scrollTop = follow ? list.scrollHeight : top
    // A newest session reply too tall for the list opens at its start, not its end; while the reader stays on it, later renders keep their place.
    const last = follow && fresh && th.length && th[th.length - 1].role !== 'user' ? list.querySelector('.th-msg:last-of-type') : null
    if (last && last.offsetHeight > list.clientHeight) list.scrollTop += last.getBoundingClientRect().top - list.getBoundingClientRect().top
  }
  const f = caret ? $('#pane-text') : key && el.querySelector(key)
  if (f) { f.focus({ preventScroll: true }); if (caret) f.setSelectionRange(...caret) }
  else if (was) el.focus({ preventScroll: true })
}

function renderPanel() {
  const el = $('#nodepanel'), n = S.sel && node(S.sel)
  document.body.classList.toggle('np-open', !!n)
  el.hidden = !n
  syncInert()
  if (!n) { el.replaceChildren(); delete el.dataset.node; return }
  const was = el.contains(document.activeElement) && document.activeElement !== el ? document.activeElement : null
  const key = was && !was.hasAttribute('data-draft') ? npFocusKey(was) : null
  const old = el.querySelector('.np-body')
  const top = old && el.dataset.node === n.id ? old.scrollTop : 0
  const oldList = el.dataset.node === n.id && el.querySelector('.th-list')
  const follow = !oldList || oldList.scrollHeight - oldList.scrollTop - oldList.clientHeight < 8
  const listTop = oldList ? oldList.scrollTop : 0
  el.dataset.node = n.id
  const lane = LANES.find(l => l[0] === laneOf(n))
  const sec = (title, ...kids) => h('section', { class: 'np-sec' }, h('h3', {}, title), ...kids)
  const here = arr(S.plan.comments).filter(c => c.anchor === n.id)
  const cms = here.filter(c => !here.includes(cmParent(c))) // a reply to a thread root on this node shows inside the root
  const body = h('div', { class: 'np-body' },
    isPhone() && S.err ? h('p', { class: 'np-err', role: 'alert' }, S.err) : null,
    npAnswerable(n) ? sec('Answer', ...npAnswer(n)) : null,
    sec('Details', ...npDetails(n)),
    sec('Actions', ...npActions(n)),
    sec('Linked nodes', ...npLinks(n)),
    cms.length ? sec('Comments', h('div', { id: 'nodecomments' }, cms.map(c => cmCard(c, 'panel', false)))) : null,
    h('section', { class: 'np-sec np-hist' }, h('h3', {}, 'History'), npHistory(n)),
    sec('Conversation', h('div', { id: 'nodethread', 'data-node': n.id }, npThread(n))))
  el.replaceChildren(h('div', { class: 'np-head' },
    h('div', { class: 'np-top' }, h('span', { class: 'np-id' }, n.id), h('span', { class: 'np-kind' }, n.kind), chip(display(n), true), lane ? h('span', { class: 'np-lane' }, lane[1] + ' lane') : null,
      h('button', { class: 'btn np-close', title: 'Close (Esc)', onclick: closePanel }, 'Close')),
    h('h2', {}, n.label)), body)
  body.scrollTop = top
  const list = body.querySelector('.th-list')
  if (list) list.scrollTop = follow ? list.scrollHeight : listTop
  if (was && !el.contains(document.activeElement)) (key && el.querySelector(key) || el).focus({ preventScroll: true })
}

// ---------- events ----------
// The core's refusals that mean "your list is old", in plain words. A match refreshes the list; the notice goes when the refresh shows the new state.
const STALE = [
  [/^ref must name an existing comment/, 'That comment changed; the list was refreshed'],
  [/^Only an? \w+ comment can be /, 'That comment changed; the list was refreshed'],
  [/^The proposal changed/, 'That proposal changed; the list was refreshed'],
  [/^Proposal no longer applies/, 'The plan changed since this proposal was made; the list was refreshed. Ask for a new one with Rework.'],
]
async function post(ev) {
  if (S.busy) return null
  S.busy = true
  S.errStale = false
  document.body.classList.add('busy')
  try {
    const res = await fetch('/api/plan/' + encodeURIComponent(task) + '/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(ev) })
    let data = null
    try { data = await res.json() } catch (e) { /* not JSON */ }
    if (res.ok && data && data.ok) {
      S.err = null; S.lint = null; S.form = null
      toast((data.summary || 'Done') + ' (rev ' + data.rev + ')' + (data.nudge ? '. The session is told.' : ''))
      pollNow()
      return data
    }
    if (res.status === 409 && data && Array.isArray(data.lint)) {
      S.lint = data.lint
      S.err = 'Cannot approve yet: ' + data.lint.filter(f => f.severity === 'block').length + ' blocking finding(s). See the readiness gate on the PRD tab.'
      S.view = 'prd'
    } else {
      const raw = data && data.error, stale = typeof raw === 'string' && STALE.find(([re]) => re.test(raw))
      S.err = stale ? stale[1] : raw || (res.status === 413 ? 'That text is too long to send (the limit is about 16 KB). Shorten it and try again.' : 'The server answered ' + res.status + '.')
      if (stale) { S.errStale = true; toast(S.err); pollNow() }
    }
  } catch (e) {
    S.err = 'Could not reach the server: ' + e.message
  } finally {
    S.busy = false
    document.body.classList.remove('busy')
    if (S.plan) renderAll()
  }
  return null
}

// ---------- live updates: poll with the rev we have; 2 s while visible, 15 s hidden ----------
let timer = null, inflight = false, again = false
const schedule = () => { clearTimeout(timer); timer = setTimeout(poll, document.hidden ? 15000 : 2000) }
const pollNow = () => poll()
async function poll() {
  clearTimeout(timer)
  if (inflight) { again = true; return }
  inflight = true
  try {
    const res = await fetch('/api/plan/' + encodeURIComponent(task) + (S.rev != null ? '?rev=' + S.rev : ''))
    let data = null
    try { data = await res.json() } catch (e) { /* not JSON */ }
    if (res.status === 404) { S.missing = true; S.online = true; showFatal('No plan for “' + task + '” yet. It appears here as soon as the session starts one.', false) }
    else if (!res.ok || !data) throw new Error('HTTP ' + res.status)
    else {
      S.online = true
      if (S.missing) { S.missing = false; $('#fatal').hidden = true }
      if (!data.unchanged) apply(data)
    }
  } catch (e) {
    S.online = false
  } finally {
    inflight = false
    if (S.plan) renderLive()
    if (again) { again = false; poll() } else schedule()
  }
}
function apply(data) {
  const old = S.plan
  const plan = data.plan
  const first = !old
  S.plan = plan
  S.prd = data.prd || ''
  S.rev = data.rev != null ? data.rev : plan.rev
  const nj = {}
  for (const n of plan.nodes) {
    nj[n.id] = JSON.stringify(n)
    if (!first && S.nodeJson[n.id] !== nj[n.id]) S.flash.nodes.add(n.id)
  }
  S.nodeJson = nj
  const chunks = {}
  for (const c of prdChunks(S.prd)) if (c.head) { chunks[c.head] = c.lines.join('\n'); if (!first && S.prdChunks[c.head] !== chunks[c.head]) S.flash.prd.add(c.head) }
  S.prdChunks = chunks
  if (!first) for (const r of arr(plan.recent)) if (r.rev > old.rev) S.flash.recent.add(r.rev)
  if (!first && old.rev !== plan.rev) S.lint = null
  if (S.errStale) S.err = S.errStale = null // the refresh shows the state the refusal was about
  if (first && !S.sel) {
    const id = hashNode(), n = id && node(id)
    if (n) { S.sel = id; S.collapsed[laneOf(n)] = false }
  }
  if (first && hashPane()) { S.pane.open = true; S.view = 'prd' }
  if (S.sel && !node(S.sel)) { toast(S.sel + ' was removed by the session'); S.sel = null; syncHash() }
  for (const id of Object.keys(S.asking)) if (plan.rev >= S.asking[id]) delete S.asking[id]
  if (S.pane.asking != null && plan.rev >= S.pane.asking) S.pane.asking = null
  if (S.form && S.form.where === 'node' && S.form.node !== S.sel) S.form = null
  // A draft belongs to the question it was typed for: when focus moves on, it is dropped, never rebound to the new question.
  if (S.form && S.form.where === 'now' && S.form.node !== plan.frontier.find(id => node(id))) {
    if (S.form.text.trim()) S.err = S.form.node + (['settled', 'killed'].includes((node(S.form.node) || {}).status) ? ' was answered elsewhere' : ' is no longer in focus') + '. Your draft for it was not sent.'
    S.form = null
  }
  $('#fatal').hidden = true
  $('#planui').hidden = false
  renderAll()
  if (first && paneSheet() && !S.sel) $('#prdpane').focus({ preventScroll: true })
}
function showFatal(msg, bad) {
  const f = $('#fatal')
  f.textContent = msg
  f.className = 'fatal' + (bad ? ' bad' : '')
  f.hidden = false
  if (!S.plan) $('#planui').hidden = true
}

// ---------- plan list (/plan) ----------
async function loadList() {
  $('#listui').hidden = false
  const box = $('#plist')
  try {
    const res = await fetch('/api/plans')
    const data = await res.json()
    if (!res.ok || !Array.isArray(data)) throw new Error((data && data.error) || 'HTTP ' + res.status)
    box.replaceChildren(data.length ? h('ul', {}, data.map(p => {
      const pr = p.progress || { settled: 0, total: 0 }
      const bar = h('span', { class: 'bar', role: 'img', 'aria-label': pr.settled + ' of ' + pr.total + ' settled' }, h('i'))
      bar.firstChild.style.width = (pr.total ? Math.round(100 * pr.settled / pr.total) : 0) + '%'
      return h('li', {}, h('a', { class: 'pl card', href: '/plan/' + encodeURIComponent(p.id) },
        h('div', { class: 'pt' }, p.title || p.id),
        h('div', { class: 'pm' }, h('span', { class: 'mono' }, p.id), h('span', { class: 'chip open' }, p.stage), h('span', { class: 'meter' }, h('b', {}, pr.settled + '/' + pr.total), ' settled ', bar), h('span', {}, 'rev ' + p.rev), h('span', { title: p.updated }, 'updated ' + fmtAt(p.updated)))))
    })) : h('p', { class: 'why' }, 'No plans yet.'))
  } catch (e) {
    box.replaceChildren(h('p', { class: 'fatal bad' }, 'Could not load the plan list: ' + e.message))
  }
}

setInterval(rvTick, 10000)
document.addEventListener('visibilitychange', () => { if (S.plan || task) (document.hidden ? schedule() : poll()) })
window.matchMedia('(max-width:640px)').addEventListener('change', () => { if (S.plan) { renderTabs(); renderPanel() } })
window.matchMedia('(min-width:1800px)').addEventListener('change', () => { if (S.plan) { renderTabs(); renderPanel() } })
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || ev.defaultPrevented) return
  if (S.sel) closePanel()
  else if (paneSheet()) closePane()
})
let spyQueued = false
window.addEventListener('scroll', () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(() => { spyQueued = false; prdSpy() }) } }, { passive: true })
if (task === null) loadList()
else if (!task) showFatal('That plan id is not valid.', true)
else poll()
</script>
