<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Plan</title>
<style nonce="__NONCE__">
:root{
  --bg:#f4f2ec; --surface:#fffefa; --surface2:#efece3; --line:#d8d3c5; --ink:#201e19; --muted:#6a6558;
  --focus:#0d6475; --focus-bg:#e0eff1;
  --ok:#2d6a3e; --ok-bg:#e3eee3;
  --warn:#8a5d00; --warn-bg:#f5ebcf;
  --block:#5b6370; --block-bg:#e8e9ec;
  --bad:#a8301f; --bad-bg:#f5e0db;
  --hi:#ffd84a; --on-hi:#1b1600; --shadow:#cdc7b6;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --surface:#1c1f24; --surface2:#23272d; --line:#353a42; --ink:#e8e5dc; --muted:#9b9a91;
    --focus:#59b8c8; --focus-bg:#173238;
    --ok:#83c795; --ok-bg:#1b2c21;
    --warn:#e3b64f; --warn-bg:#33290f;
    --block:#a3acb9; --block-bg:#262a31;
    --bad:#ee8774; --bad-bg:#3a1f1a;
    --hi:#ffd84a; --on-hi:#1b1600; --shadow:#0a0b0d;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1360px;margin:0 auto;padding:0 20px 24px}
body.busy .btn,body.busy .opt,body.busy .b-btn{pointer-events:none;opacity:.6}

/* notice */
.notice{position:sticky;top:0;z-index:40;display:flex;gap:10px;align-items:flex-start;margin:0 -4px;padding:9px 12px;border:1px solid var(--bad);border-radius:0 0 8px 8px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.notice .msg{flex:1;min-width:0;overflow-wrap:anywhere}
.notice button{background:none;border:0;padding:0 2px;color:inherit;font-weight:700}

/* header */
.hdr{padding:14px 0 12px}
.hdr-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.title{font:600 20px/1.2 var(--serif);margin:0;letter-spacing:.1px;overflow-wrap:anywhere}
.title .dia{color:var(--focus);font-size:15px;margin-right:6px}
.stepper{display:flex;gap:0;margin:0;padding:0;list-style:none;font-size:12px;margin-left:auto}
.stepper li{display:flex;align-items:center;color:var(--muted);white-space:nowrap}
.stepper li+li::before{content:"";width:16px;height:1px;background:var(--line);margin:0 6px}
.stepper li.done{color:var(--ok)}
.stepper li.skipped{color:var(--muted);opacity:.65}
.stepper li.cur span{color:var(--ink);font-weight:700;border:1.5px solid var(--focus);border-radius:4px;padding:1px 7px;background:var(--focus-bg)}
.hdr-meta{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.hdr-meta .mi{display:contents}
.hdr-meta b{color:var(--ink);font-weight:600}
.hdr-meta .req{color:var(--warn);font-weight:600}
.meter{display:inline-flex;align-items:center;gap:8px}
.bar{width:150px;height:8px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s ease-in-out infinite}
.live.off{color:var(--warn)}
.live.off::before{background:var(--warn);animation:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}*{transition:none!important;animation-duration:.01ms!important}.b-card:hover,.b-btn:hover:not(:disabled){transform:none}.b-card.flash{animation:none}}

/* layout */
.main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fatal{padding:24px 0;color:var(--muted);font-size:15px}
.fatal.bad{color:var(--bad)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--sans);padding:3px 7px 3px 6px;border-radius:999px;border:1px solid;white-space:nowrap}
.chip.settled{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.chip.focus,.chip.doing{color:var(--focus);background:var(--focus-bg);border-color:transparent}
.chip.assumed{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.chip.blocked{color:var(--block);background:var(--block-bg);border-color:transparent}
.chip.failed{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.chip.parked,.chip.killed{color:var(--muted);background:transparent;border-color:var(--line)}
.chip.killed{text-decoration:line-through}
.chip.open{color:var(--ink);background:transparent;border-color:var(--line)}

/* NOW card */
#now{padding:14px 14px 12px}
#now h2{margin:6px 0 2px;font:600 17px/1.25 var(--serif);overflow-wrap:anywhere}
.qid{font:600 12px var(--mono);color:var(--focus)}
.why{margin:4px 0 10px;font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px 8px 32px;position:relative}
.opt::before{content:"";position:absolute;left:10px;top:11px;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--muted)}
.opt.pick{border-color:var(--focus);background:var(--focus-bg)}
.opt.pick::before{border-color:var(--focus);background:radial-gradient(var(--focus) 0 4px,transparent 5px)}
.opt b{font-weight:600}
.opt .star{color:var(--warn);font-weight:700}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.opt.other{color:var(--muted)}
.reason{font-size:12.5px;border-left:3px solid var(--warn);background:var(--warn-bg);padding:7px 10px;border-radius:0 6px 6px 0;margin-bottom:12px}
.reason b{color:var(--warn)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--focus);border-color:var(--focus);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0b1a1d}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary.big{flex:1 1 100%;order:-1}
.field{display:block;width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--ink)}
textarea.field{min-height:66px;resize:vertical}
.form{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.form .btns{justify-content:flex-end}
.next{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.next ul{margin:6px 0 0;padding:0;list-style:none}
.next li{display:flex;align-items:center;gap:8px;padding:4px 0}
.next .qid{color:var(--muted)}
.next .t{flex:1;min-width:0;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left}
.reqs{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.reqs ul{margin:6px 0 0;padding:0;list-style:none}
.req-i{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:5px 0;border-bottom:1px dotted var(--line)}
.req-i:last-child{border-bottom:0}
.req-i .ty{font:600 11px var(--mono);color:var(--warn)}
.req-i .tx{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.req-i .at{font:11.5px var(--mono);color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--focus);font:600 12px var(--mono);cursor:pointer}
.done-card{padding:6px 0;color:var(--muted)}

/* right area */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 8px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px 9px;color:var(--muted);font-weight:600;font-size:13px;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--focus)}
.panel{display:none;padding:14px}
.panel.on{display:block}

/* lanes */
.lanes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.lane-h{display:flex;align-items:baseline;justify-content:space-between;width:100%;background:none;border:0;padding:0 2px 6px;margin-bottom:8px;border-bottom:1px solid var(--line);text-align:left;cursor:default}
.lane-h .n{font:600 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lane-h .c{font:11px var(--mono);color:var(--muted)}
.node{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:6px 8px 7px;margin-bottom:8px;position:relative}
.node:hover{border-color:var(--muted)}
.node .r1{display:flex;align-items:center;justify-content:space-between;gap:4px}
.node .id{font:600 11px var(--mono);color:var(--muted);white-space:nowrap}
.node .g{font:700 13px/1 var(--sans)}
.node .t{display:block;font-weight:600;font-size:12.5px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.node .s{display:block;font-size:11.5px;line-height:1.3;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.node .chip .wd{display:none}
.node .chip{padding:3px 6px}
.node.s-settled{border-left-color:var(--ok)} .node.s-settled .g{color:var(--ok)}
.node.s-focus,.node.s-doing{border-left-color:var(--focus);background:var(--focus-bg)} .node.s-focus .g,.node.s-doing .g{color:var(--focus)}
.node.s-assumed{border-left-color:var(--warn);border-style:dashed;border-left-style:solid} .node.s-assumed .g{color:var(--warn)}
.node.s-blocked{border-left-color:var(--block);border-style:dashed;border-left-style:solid;background:var(--block-bg)} .node.s-blocked .g{color:var(--block)}
.node.s-failed{border-left-color:var(--bad);background:var(--bad-bg)} .node.s-failed .g{color:var(--bad)}
.node.s-parked{border-left-color:var(--line);border-style:dotted;border-left-style:solid;color:var(--muted)} .node.s-parked .t{font-weight:500}
.node.s-killed{border-left-color:var(--line);color:var(--muted)} .node.s-killed .t{font-weight:500;text-decoration:line-through}
.node.s-open .g{color:var(--muted)}
.node.sel{outline:2px solid var(--ink);outline-offset:1px}
.node.dep{outline:2px solid var(--focus);outline-offset:1px}
.node.dep::after{content:"depends on selection";position:absolute;right:6px;bottom:-7px;font:600 9.5px var(--sans);background:var(--focus);color:var(--surface);padding:1px 5px;border-radius:3px}
.node.pre{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--muted)}
.node.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{0%,30%{box-shadow:0 0 0 3px var(--ok)}100%{box-shadow:0 0 0 3px transparent}}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin:2px 0 12px;font-size:12px;color:var(--muted);align-items:center}
.actbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:13px}
.actbar .who{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.actbar .who b{font-family:var(--mono)}
.actbar .who.hint{color:var(--muted)}
.actbar .deps{color:var(--muted);font-size:12px}
.actbar .btn{padding:6px 11px}
.actbar .frm{flex:1 1 100%;display:flex;gap:8px;flex-wrap:wrap}
.actbar .frm .field{flex:1 1 220px;min-width:0;padding:6px 10px}
.buildlink{display:none;margin-top:12px}

/* PRD */
.prdhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:12px;color:var(--muted)}
.prdhead b{color:var(--ink)}
.prdhead .appr{color:var(--ok);font-weight:600}
.prdhead .appr.drift{color:var(--warn)}
.prd{font:15px/1.6 var(--serif);max-width:76ch}
.prd section{padding:10px 0 8px;border-bottom:1px solid var(--line);scroll-margin-top:12px}
.prd h1{margin:6px 0 4px;font:600 17px/1.3 var(--serif)}
.prd h2{margin:0 0 4px;font:600 15px/1.3 var(--serif)}
.prd h2 .no{font:600 11px var(--mono);color:var(--muted);margin-right:7px}
.prd h3,.prd h4,.prd h5,.prd h6{margin:10px 0 2px;font:600 14px/1.3 var(--serif)}
.prd p{margin:4px 0;overflow-wrap:anywhere}
.prd ul,.prd ol{margin:4px 0;padding-left:20px}
.prd li{overflow-wrap:anywhere}
.prd code{font:12.5px var(--mono);background:var(--surface2);padding:0 4px;border-radius:3px;overflow-wrap:anywhere}
.prd pre{margin:6px 0;padding:8px 10px;background:var(--surface2);border-radius:6px;overflow-x:auto;font:12.5px/1.4 var(--mono)}
.prd pre code{padding:0;background:none;overflow-wrap:normal}
.prd blockquote{margin:6px 0;padding:2px 10px;border-left:3px solid var(--line);color:var(--muted)}
.prd hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.prd .tw{overflow-x:auto;margin:6px 0}
.prd table{border-collapse:collapse;font:13px/1.4 var(--sans);min-width:100%}
.prd th,.prd td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.prd th{background:var(--surface2)}
.prd section.empty{opacity:.55}
.prd section.empty h2{color:var(--muted)}
.prd section.empty blockquote{border:0;padding:0;margin:0;font-style:italic}
.prd section.empty .pend{font:600 10px var(--sans);letter-spacing:.07em;text-transform:uppercase;border:1px dashed var(--muted);border-radius:3px;padding:1px 5px;margin-left:8px;color:var(--muted)}
.prd section.fresh{animation:freshbg 2.4s ease-out}
@keyframes freshbg{0%,35%{background:var(--ok-bg)}100%{background:transparent}}
.ncl{font:600 12px var(--mono);color:var(--bad);background:var(--bad-bg);border:1px dashed var(--bad);border-radius:4px;padding:1px 6px;text-decoration:none}
.ncl:hover{text-decoration:underline}
.gate{position:sticky;bottom:0;margin:14px -14px -14px;padding:12px 14px;background:var(--surface);border-top:2px solid var(--line);border-radius:0 0 8px 8px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.gate .lint{flex:1 1 380px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 18px;margin:0;padding:0;list-style:none;font-size:12.5px}
.gate .lint li{display:flex;gap:6px;min-width:0;overflow-wrap:anywhere}
.gate .lint .x{color:var(--bad)} .gate .lint .ok{color:var(--ok)} .gate .lint .w{color:var(--warn)}
.gate .lint b{flex:none;width:14px;font-weight:700}
.gate .ap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gate .ap small{font-size:11.5px;color:var(--muted)}

/* board (ideate and research, contract §12): classes are b- prefixed so they never meet the lanes styles */
.b-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.b-stat{border:1px solid var(--line);border-radius:6px;background:var(--surface2);padding:8px 10px;min-width:0}
.b-stat .k{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.b-stat .v{font:600 22px/1.2 var(--serif);margin-top:4px;overflow-wrap:anywhere}
.b-stat .v small{font:12px var(--sans);color:var(--muted);margin-left:4px}
.b-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.b-rail{border:1px solid var(--line);border-radius:8px;background:var(--surface);position:sticky;top:8px;max-height:calc(100dvh - 16px);overflow:auto}
.b-rail>summary{list-style:none;cursor:pointer;padding:11px 12px;font:600 15px var(--serif);display:flex;justify-content:space-between;align-items:center;min-height:44px}
.b-rail>summary::-webkit-details-marker{display:none}
.b-rail>summary::after{content:"+";font-family:var(--mono)}
.b-rail[open]>summary::after{content:"\2212"}
.b-rail-body{padding:0 12px 12px}
.b-grp{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.b-crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 0;border-top:1px solid var(--line)}
.b-crit .n{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.b-crit .d{grid-column:1;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.b-crit .o{grid-column:1 / -1;font:11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.b-wctl{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:4px}
.b-wctl button{width:32px;height:32px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);font:16px/1 var(--mono);padding:0}
.b-wctl button:hover:not(:disabled){border-color:var(--focus);color:var(--focus)}
.b-wctl button:disabled{opacity:.4;cursor:not-allowed}
.b-wctl output{min-width:48px;text-align:center;font:13px var(--mono)}
.b-wctl output small{display:block;font-size:10px;color:var(--muted)}
.b-scale{font-size:12px;color:var(--muted);margin:10px 0 0}
.b-link{background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;font-size:12.5px;min-height:28px}
.b-tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.b-seg{display:inline-flex;border:1.5px solid var(--line);border-radius:5px;overflow:hidden}
.b-seg button{border:0;background:var(--surface);padding:7px 12px;font-size:12.5px;min-height:34px}
.b-seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.b-btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:4px;padding:6px 10px;font-weight:600;font-size:12.5px;min-height:34px;box-shadow:2px 2px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
.b-btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}
.b-btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:none}
.b-btn:disabled{opacity:.5;cursor:not-allowed}
.b-btn.primary{background:var(--focus);border-color:var(--focus);color:#fff}
@media (prefers-color-scheme:dark){.b-btn.primary{color:#0b1a1d}}
.b-btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.b-btn.ghost{box-shadow:none;border-color:var(--line)}
.b-btn.boost{background:var(--hi);color:var(--on-hi)}
.b-banner{border:1.5px dashed var(--focus);background:var(--focus-bg);border-radius:6px;padding:9px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;font-size:13px}
.b-sec{font:600 17px/1.2 var(--serif);margin:16px 0 8px;display:flex;gap:10px;align-items:baseline}
.b-sec:first-child{margin-top:0}
.b-sec small{font:12px var(--mono);color:var(--muted);font-weight:400}
.b-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.b-empty{color:var(--muted);border:1.5px dashed var(--line);border-radius:6px;padding:12px}
.b-card{position:relative;background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;box-shadow:3px 3px 0 var(--shadow);transition:transform .16s,box-shadow .16s}
.b-card:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:5px 7px 0 var(--shadow)}
.b-card.target{outline:3px dashed var(--focus);outline-offset:3px}
.b-card.flash{animation:bpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bpop{0%{transform:scale(1)}40%{transform:scale(1.03) rotate(.5deg)}100%{transform:scale(1)}}
.b-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.b-id{font:600 11.5px var(--mono);background:var(--ink);color:var(--bg);padding:2px 6px}

<script nonce="__NONCE__">
'use strict'
const $ = s => document.querySelector(s)
// Every piece of plan text goes in through append(string): a text node, never markup.
// append() and replaceChildren() stringify null, so every child list goes through kidsOf first.
const kidsOf = kids => kids.flat().filter(k => k != null && k !== false)
function h(tag, props, ...kids) {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === false || v === null) continue
    if (k === 'class') e.className = v
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
    else e.setAttribute(k, v === true ? '' : v)
  }
  e.append(...kidsOf(kids))
  return e
}

const STAGES = ['frame', 'explore', 'decide', 'shape', 'ready', 'building', 'shipped']
const LANES = [['why', 'Why'], ['who', 'Who'], ['scope', 'Scope'], ['decisions', 'Decisions'], ['risks', 'Risks'], ['slices', 'Slices'], ['tasks', 'Tasks']]
const KIND_LANE = { story: 'why', goal: 'why', criterion: 'why', user: 'who', nongoal: 'scope', constraint: 'scope', requirement: 'scope', edge: 'scope', boundary: 'scope', assumption: 'risks', risk: 'risks', approach: 'decisions', decision: 'decisions', slice: 'slices', task: 'tasks', discovery: 'tasks' }
const GL = { settled: '✓', focus: '◉', assumed: '?', blocked: '◌', parked: '⏸︎', open: '○', killed: '✕', doing: '◐', failed: '✗' }
const WD = { settled: 'settled', focus: 'in focus', assumed: 'assumed', blocked: 'blocked', parked: 'parked', open: 'open', killed: 'killed', doing: 'doing', failed: 'failed' }
const SETTLED = ['settled', 'done', 'killed']

// ---------- state ----------
const segs = location.pathname.split('/').filter(Boolean)
let task = null
if (segs.length > 1) { try { task = decodeURIComponent(segs[segs.length - 1]) } catch (e) { task = '' } }
const S = {
  plan: null, prd: '', rev: null, sel: null, view: null, collapsed: {}, collapsedInit: false,
  pick: null, form: null, busy: false, lint: null, err: null, online: true, missing: false,
  bd: { open: {}, shortOnly: false, kill: null, killText: '', killErr: false, focusKill: false, promote: null, merge: null },
  focusDraft: false, nodeJson: {}, prdChunks: {}, flash: { nodes: new Set(), prd: new Set(), recent: new Set() },
}

if (location.hash === '#board') S.view = 'board'
const isPhone = () => window.matchMedia('(max-width:640px)').matches
function curView() {
  const board = boardOn(S.plan)
  let v = S.view === 'board' && !board ? null : S.view
  v = v || (board && ['ideate', 'research'].includes(S.plan.stage) ? 'board' : isPhone() ? 'now' : 'lanes')
  if (v === 'now' && !isPhone()) v = 'lanes'
  return v
}
const node = id => (S.plan.nodes || []).find(n => n.id === id)
const laneOf = n => (LANES.some(l => l[0] === n.lane) ? n.lane : KIND_LANE[n.kind] || 'scope')
const arr = v => (Array.isArray(v) ? v : [])

// ---------- derived node state (contract §5: a question is blocked when open but not eligible) ----------
function unsettledDeps(n) {
  return arr(n.depends_on).filter(d => { const x = node(d); return x && !SETTLED.includes(x.status) })
}
function display(n) {
  const st = n.status
  if (st === 'killed') return 'killed'
  if (st === 'parked') return 'parked'
  if (st === 'failed') return 'failed'
  if (st === 'doing') return 'doing'
  if (st === 'done') return 'settled'
  if (st === 'settled') return n.by_default ? 'assumed' : 'settled'
  if (n.kind === 'question' && S.plan.frontier[0] === n.id) return 'focus'
  if (unsettledDeps(n).length) return 'blocked'
  if (n.kind === 'assumption') return 'assumed'
  return 'open'
}
function optionLabel(q, key) {
  const o = arr(q.options).find(x => x.key === key)
  return o ? o.label : key
}
function sub(n, d) {
  if (d === 'focus') return 'in focus'
  if (d === 'blocked') return 'blocked by ' + unsettledDeps(n).join(', ')
  if (n.kind === 'question' && n.answer) return n.answer.choice ? optionLabel(n, n.answer.choice) : String(n.answer.text || '')
  if (n.kind === 'decision' && n.chose) return n.chose
  if (n.kind === 'assumption' && n.validate_by) return n.validate_by
  if (n.kind === 'task') return n.status + (n.check ? '' : ' · no check yet')
  if (d === 'assumed' && n.by_default) return 'default, unexamined'
  return ''
}
function dependents(id) {
  const out = new Set(), stack = [id]
  while (stack.length) {
    const c = stack.pop()
    for (const n of S.plan.nodes) if (arr(n.depends_on).includes(c) && !out.has(n.id)) { out.add(n.id); stack.push(n.id) }
  }
  return out
}

// ---------- small markdown renderer: DOM nodes only, plan text is never parsed as HTML ----------
const INLINE = /`([^`]+)`|\*\*(.+?)\*\*|~~(.+?)~~|\[NEEDS CLARIFICATION: ([^\]]+)\]|\[([^\]]+)\]\(([^)\s]+)\)|\*([^*\s](?:[^*]*[^*\s])?)\*/g
function mdInline(parent, text) {
  const re = new RegExp(INLINE.source, 'g')
  let last = 0, m
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(text.slice(last, m.index))
    if (m[1] != null) parent.append(h('code', {}, m[1]))
    else if (m[2] != null) { const e = h('strong'); mdInline(e, m[2]); parent.append(e) }
    else if (m[3] != null) { const e = h('del'); mdInline(e, m[3]); parent.append(e) }
    else if (m[4] != null) {
      const id = m[4].trim().split(/[\s,]+/)[0]

// ---------- board: Ideate and Research (contract §12). Plan data only ever enters through h() text nodes. ----------
const BD_STEP = 5
const BD_VERDICT = { ok: ['ok', '✓'], warn: ['q', '!'], bad: ['no', '✕'], na: ['na', '–'] }
const BD_CHECKS = ['allowed', 'exists', 'feasible']
const BD_LOG = ['boost', 'kill', 'restore', 'merge', 'twist', 'promote', 'weight', 'weights_reset', 'research', 'score', 'research_status']
const boardOn = p => !!p && (['ideate', 'research'].includes(p.stage) || arr(p.nodes).some(n => n.kind === 'idea' || n.kind === 'rubric'))
const boostOf = i => (Number.isInteger(i.boost) ? i.boost : 0)

// Board score of §12.1: weighted mean over the counted rubrics the idea has a score for.
function boardScore(idea, counted) {
  let w = 0, sum = 0, n = 0
  for (const r of counted) {
    const s = (idea.scores || {})[r.id]
    if (s && typeof s.value === 'number') { w += r.weight; sum += r.weight * s.value; n++ }
  }
  return { value: w ? sum / w : null, n, m: counted.length }
}
const boardRank = sc => (sc.n > 0 && sc.n === sc.m ? 0 : sc.n > 0 ? 1 : 2)

// A <details> whose open state survives the re-render of the next poll.
function bdDetails(key, dflt, cls, summary, ...kids) {
  const open = key in S.bd.open ? S.bd.open[key] : dflt
  return h('details', { class: cls, open, ontoggle: e => { S.bd.open[key] = e.target.open } }, h('summary', {}, ...summary), ...kids)
}
async function bpost(ev, done) {
  const r = await post(ev)
  if (r) { if (done) done(); renderBoard() } else if (S.err) toast(S.err)
  return r
}
function submitKill(id) {
  const text = S.bd.killText.trim()
  if (!text) { S.bd.killErr = true; S.bd.focusKill = true; renderBoard(); return }
  bpost({ type: 'kill', node: id, text }, () => { S.bd.kill = null })
}

function bdResearch(p, idea) {
  const jobs = arr(p.nodes).filter(n => n.kind === 'research' && arr(n.targets).includes(idea.id))
    .map(n => ({ state: n.state, note: n.note, report: n.report }))
  const shortlisted = idea.status === 'open' && boostOf(idea) >= 1
  if (!jobs.some(j => j.state === 'queued' || j.state === 'running') &&
    arr(p.requests).some(r => r.type === 'research' && (r.node === idea.id || (!r.node && shortlisted)))) jobs.push({ state: 'queued' })
  return jobs.map(j => h('div', { class: 'b-rs', 'data-state': j.state },
    h('span', { class: 'eyebrow' }, 'research'),
    h('b', {}, j.state === 'running' ? 'researching…' : j.state),
    j.state === 'done' && j.report ? h('code', {}, j.report) : null,
    j.note && j.state !== 'done' ? h('span', { class: 'nt' }, j.note) : null))
}

function bdBar(r, s) {
  if (!s || typeof s.value !== 'number') return h('div', { class: 'b-bar none' }, h('span', {}, r.label), h('span', { class: 'bv' }, 'not scored yet'), h('span', { class: 'track' }))
  const fill = h('i')
  fill.style.width = Math.max(0, Math.min(100, s.value * 20)) + '%'
  return h('div', { class: 'b-bar' + (r.weight > 0 ? '' : ' dim') },
    h('span', {}, r.label), h('span', { class: 'bv' }, s.value + ' / 5' + (s.label ? ' · ' + s.label : '')),
    h('span', { class: 'track' }, fill),
    s.rationale ? h('p', {}, s.rationale) : null,
    arr(s.sources).length ? h('p', { class: 'src' }, 'sources: ' + s.sources.join(', ')) : null)
}
function bdGateBar(r, g) {
  if (!g) return h('div', { class: 'b-bar none' }, h('span', {}, r.label), h('span', { class: 'bv' }, 'not scored yet'), h('span', { class: 'track' }))
  const word = g.pass === true ? 'passes' : g.pass === false ? 'fails' : 'undecided'
  const fill = h('i')
  fill.style.width = g.pass === null ? '0%' : '100%'
  return h('div', { class: 'b-bar' },
    h('span', {}, r.label + ' (gate)'), h('span', { class: 'bv' }, word),
    h('span', { class: 'track ' + (g.pass === true ? 'pass' : g.pass === false ? 'fail' : '') }, fill),
    g.note ? h('p', {}, g.note) : null,
    arr(g.sources).length ? h('p', { class: 'src' }, 'sources: ' + g.sources.join(', ')) : null)
}

function renderBoard() {
  const panel = $('#p-board')
  if (!S.plan || !boardOn(S.plan)) { panel.replaceChildren(); return }
  const p = S.plan, bd = S.bd
  const hadKill = document.activeElement && document.activeElement.hasAttribute && document.activeElement.hasAttribute('data-bd-kill')
  const live = arr(p.nodes)
  const ideas = live.filter(n => n.kind === 'idea')
  if (bd.kill && !ideas.some(i => i.id === bd.kill && i.status !== 'killed')) bd.kill = null
  if (bd.promote && !ideas.some(i => i.id === bd.promote && i.status === 'open')) bd.promote = null
  if (bd.merge && !ideas.some(i => i.id === bd.merge && i.status !== 'killed')) bd.merge = null
  const all = live.filter(n => n.kind === 'rubric' && n.status !== 'killed')
  const ctx = { all, rubrics: all.filter(r => r.group !== 'gate'), gates: all.filter(r => r.group === 'gate'), counted: all.filter(r => r.group !== 'gate' && r.weight > 0) }
  const rows = ideas.filter(i => i.status !== 'killed').map((idea, k) => {
    const sc = boardScore(idea, ctx.counted)
    return { idea, sc, k, key: (sc.value || 0) + 0.25 * boostOf(idea) }
  }).sort((a, b) => boardRank(a.sc) - boardRank(b.sc) || b.key - a.key || a.k - b.k)
  const shortlisted = rows.filter(r => r.idea.status === 'open' && boostOf(r.idea) >= 1)
  const shown = bd.shortOnly ? shortlisted : rows
  const dead = ideas.filter(i => i.status === 'killed')
  const full = rows.filter(r => r.sc.m > 0 && r.sc.n === r.sc.m).length
  const running = live.filter(n => n.kind === 'research' && n.state === 'running').length
  const logRows = arr(p.recent).filter(r => BD_LOG.includes(r.type)).slice(0, 8)

  const stats = h('div', { class: 'b-stats' },
    h('div', { class: 'b-stat' }, h('div', { class: 'k' }, 'In play'), h('div', { class: 'v' }, String(rows.length))),
    h('div', { class: 'b-stat' }, h('div', { class: 'k' }, 'Shortlisted'), h('div', { class: 'v' }, String(shortlisted.length))),
    h('div', { class: 'b-stat' }, h('div', { class: 'k' }, 'Fully scored'), h('div', { class: 'v' }, String(full), h('small', {}, 'of ' + rows.length))),
    h('div', { class: 'b-stat' }, h('div', { class: 'k' }, 'Researching'), h('div', { class: 'v' }, String(running))),
    h('div', { class: 'b-stat' }, h('div', { class: 'k' }, 'Graveyard'), h('div', { class: 'v' }, String(dead.length))))
  const seg = (label, short) => h('button', { 'aria-pressed': String(bd.shortOnly === short), onclick: () => { bd.shortOnly = short; renderBoard() } }, label)
  const tools = h('div', { class: 'b-tools' },
    h('div', { class: 'b-seg', role: 'group', 'aria-label': 'Which ideas to show' }, seg('In play', false), seg('Shortlisted only', true)),
    h('button', { class: 'b-btn', 'data-act': 'research-shortlist', onclick: () => bpost({ type: 'research' }) }, 'Research shortlist'))
  const banner = bd.merge ? h('div', { class: 'b-banner', role: 'status' }, h('span', {}, 'Merging ' + bd.merge + ': pick the idea to merge it with.'),
    h('button', { class: 'b-btn ghost', onclick: () => { bd.merge = null; renderBoard() } }, 'Cancel')) : null
  const cards = shown.length ? h('div', { class: 'b-grid' }, shown.map(r => bdCard(p, r, ctx)))
    : h('p', { class: 'b-empty' }, bd.shortOnly ? 'Nothing is shortlisted yet. Boost an idea to shortlist it.' : 'No ideas yet. The session adds them as they come up.')
  const grave = dead.length ? bdDetails('grave', false, 'b-grave', ['Graveyard ', h('small', {}, String(dead.length))],
    h('ul', { class: 'b-gl' }, dead.map(i => h('li', { 'data-id': i.id },
      h('span', { class: 'nm' }, i.id + ' · ' + i.label), h('p', { class: 'why' }, i.kill_reason || 'no reason recorded'),
      h('button', { class: 'b-btn', 'data-act': 'restore', onclick: () => bpost({ type: 'restore', node: i.id }) }, 'Restore'))))) : null
  const log = logRows.length ? bdDetails('log', false, 'b-log', ['Board log'],
    h('ul', { class: 'b-rl' }, logRows.map(r => h('li', {}, h('span', {}, 'rev ' + r.rev), r.summary || r.type)))) : null

  panel.replaceChildren(...kidsOf([bdHandoff(p), stats,
    h('div', { class: 'b-layout' }, bdRail(ctx), h('div', {}, tools, banner, h('div', { class: 'b-sec' }, 'Ideas ', h('small', {}, 'best score first')), cards, grave, log))]))
  if (hadKill || bd.focusKill) {
    bd.focusKill = false
    const f = panel.querySelector('[data-bd-kill]')
    if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length) }
  }
}

function renderTabs() {
  const v = curView()
  if (v === 'board') S.view = 'board' // the board stays put when promote moves the stage on to Frame
  const board = boardOn(S.plan)
  const tabs = [...(board ? [['board', 'Board']] : []), ['lanes', 'Lanes'], ['prd', 'PRD'], ['build', 'Build'], ['log', 'Log']]
  $('#tabs').replaceChildren(...tabs.map(t => h('button', { class: 'tab', role: 'tab', 'aria-selected': String(v === t[0]), onclick: () => { S.view = t[0]; renderTabs() } }, t[1])))
  const bv = v === 'build' ? 'lanes' : v
  const bn = $('#bnav')
  bn.hidden = false
  bn.replaceChildren(...[['now', '◉', 'Now'], ...(board ? [['board', '▦', 'Board']] : []), ['lanes', '▤', 'Map'], ['prd', '§', 'PRD'], ['log', '≡', 'Log']].map(t =>
    h('button', { role: 'tab', 'aria-selected': String(bv === t[0]), 'data-view': t[0], onclick: () => { S.view = t[0]; renderTabs(); window.scrollTo(0, 0) } }, h('i', { 'aria-hidden': 'true' }, t[1]), t[2])))
  for (const p of ['board', 'lanes', 'prd', 'build', 'log']) $('#p-' + p).classList.toggle('on', v === p)
  document.body.setAttribute('data-view', v)
}
function renderAll() {
  const keep = document.activeElement && document.activeElement.hasAttribute && document.activeElement.hasAttribute('data-draft')
  renderHead(); renderNotice(); renderNow(); renderLanes(); renderPrd(); renderBuild(); renderLog(); renderBoard(); renderStrip(); renderTabs()
  S.flash = { nodes: new Set(), prd: new Set(), recent: new Set() }
  if (keep || S.focusDraft) {
    S.focusDraft = false
    const f = $('[data-draft]')
    if (f) { f.focus(); f.setSelectionRange && f.setSelectionRange(f.value.length, f.value.length) }
  }
}

// Select a node from anywhere (PRD link, request, up-next row): switch to the lanes and bring it into view.
function jumpTo(id) {
  const n = node(id)
  if (!n) { toast(id + ' is not in the plan.'); return }
  S.sel = id
  S.view = 'lanes'
  S.collapsed[laneOf(n)] = false
  renderLanes(); renderTabs()
  const el = document.querySelector('.node[data-id="' + CSS.escape(id) + '"]')
  if (el) el.scrollIntoView({ block: 'center' })
}

// ---------- events ----------
async function post(ev) {
  if (S.busy) return null
  S.busy = true
  document.body.classList.add('busy')
  try {
    const res = await fetch('/api/plan/' + encodeURIComponent(task) + '/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(ev) })
    let data = null
    try { data = await res.json() } catch (e) { /* not JSON */ }
    if (res.ok && data && data.ok) {
      S.err = null; S.lint = null; S.form = null
      toast((data.summary || 'Done') + ' (rev ' + data.rev + ')' + (data.nudge ? '. The session is told.' : ''))
      pollNow()
      return data
    }
    if (res.status === 409 && data && Array.isArray(data.lint)) {
      S.lint = data.lint
      S.err = 'Cannot approve yet: ' + data.lint.filter(f => f.severity === 'block').length + ' blocking finding(s). See the readiness gate on the PRD tab.'
      S.view = 'prd'
    } else S.err = (data && data.error) || 'The server answered ' + res.status + '.'
  } catch (e) {
    S.err = 'Could not reach the server: ' + e.message
  } finally {
    S.busy = false
    document.body.classList.remove('busy')
    if (S.plan) renderAll()
  }
  return null
}

// ---------- live updates: poll with the rev we have; 2 s while visible, 15 s hidden ----------
let timer = null, inflight = false, again = false
const schedule = () => { clearTimeout(timer); timer = setTimeout(poll, document.hidden ? 15000 : 2000) }
const pollNow = () => poll()
async function poll() {
  clearTimeout(timer)
  if (inflight) { again = true; return }
  inflight = true
  try {
    const res = await fetch('/api/plan/' + encodeURIComponent(task) + (S.rev != null ? '?rev=' + S.rev : ''))
    let data = null
    try { data = await res.json() } catch (e) { /* not JSON */ }
    if (res.status === 404) { S.missing = true; S.online = true; showFatal('No plan for “' + task + '” yet. It appears here as soon as the session starts one.', false) }
    else if (!res.ok || !data) throw new Error('HTTP ' + res.status)
    else {
      S.online = true
      if (S.missing) { S.missing = false; $('#fatal').hidden = true }
      if (!data.unchanged) apply(data)
    }
  } catch (e) {
    S.online = false
  } finally {
    inflight = false
    if (S.plan) renderLive()
    if (again) { again = false; poll() } else schedule()
  }
}
function apply(data) {
  const old = S.plan
  const plan = data.plan
  const first = !old
  S.plan = plan
  S.prd = data.prd || ''
  S.rev = data.rev != null ? data.rev : plan.rev
  const nj = {}
  for (const n of plan.nodes) {
    nj[n.id] = JSON.stringify(n)
    if (!first && S.nodeJson[n.id] !== nj[n.id]) S.flash.nodes.add(n.id)
  }
  S.nodeJson = nj
  const chunks = {}
  for (const c of prdChunks(S.prd)) if (c.head) { chunks[c.head] = c.lines.join('\n'); if (!first && S.prdChunks[c.head] !== chunks[c.head]) S.flash.prd.add(c.head) }
  S.prdChunks = chunks
  if (!first) for (const r of arr(plan.recent)) if (r.rev > old.rev) S.flash.recent.add(r.rev)
  if (!first && old.rev !== plan.rev) S.lint = null
  if (S.sel && !node(S.sel)) S.sel = null
  if (S.form && S.form.where === 'node' && !S.sel) S.form = null
  // A draft belongs to the question it was typed for: when focus moves on, it is dropped, never rebound to the new question.
  if (S.form && S.form.where === 'now' && S.form.node !== plan.frontier.find(id => node(id))) {
    if (S.form.text.trim()) S.err = S.form.node + (['settled', 'killed'].includes((node(S.form.node) || {}).status) ? ' was answered elsewhere' : ' is no longer in focus') + '. Your draft for it was not sent.'
    S.form = null
  }
  $('#fatal').hidden = true
  $('#planui').hidden = false
  renderAll()
}
function showFatal(msg, bad) {
  const f = $('#fatal')
  f.textContent = msg
  f.className = 'fatal' + (bad ? ' bad' : '')
  f.hidden = false
  if (!S.plan) $('#planui').hidden = true
}

// ---------- plan list (/plan) ----------
async function loadList() {
  $('#listui').hidden = false
  const box = $('#plist')
  try {
    const res = await fetch('/api/plans')
    const data = await res.json()
    if (!res.ok || !Array.isArray(data)) throw new Error((data && data.error) || 'HTTP ' + res.status)
    box.replaceChildren(data.length ? h('ul', {}, data.map(p => {
      const pr = p.progress || { settled: 0, total: 0 }
      const bar = h('span', { class: 'bar', role: 'img', 'aria-label': pr.settled + ' of ' + pr.total + ' settled' }, h('i'))
      bar.firstChild.style.width = (pr.total ? Math.round(100 * pr.settled / pr.total) : 0) + '%'
      return h('li', {}, h('a', { class: 'pl card', href: '/plan/' + encodeURIComponent(p.id) },
        h('div', { class: 'pt' }, p.title || p.id),
        h('div', { class: 'pm' }, h('span', { class: 'mono' }, p.id), h('span', { class: 'chip open' }, p.stage), h('span', { class: 'meter' }, h('b', {}, pr.settled + '/' + pr.total), ' settled ', bar), h('span', {}, 'rev ' + p.rev), h('span', { title: p.updated }, 'updated ' + fmtAt(p.updated)))))
    })) : h('p', { class: 'why' }, 'No plans yet.'))
  } catch (e) {
    box.replaceChildren(h('p', { class: 'fatal bad' }, 'Could not load the plan list: ' + e.message))
  }
}

document.addEventListener('visibilitychange', () => { if (S.plan || task) (document.hidden ? schedule() : poll()) })
window.matchMedia('(max-width:640px)').addEventListener('change', () => { if (S.plan) renderTabs() })
if (task === null) loadList()
else if (!task) showFatal('That plan id is not valid.', true)
else poll()
</script>
</body>
